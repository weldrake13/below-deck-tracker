# Development overlay: source is mounted from the host and the server restarts
# on save. Use via `./start.sh --docker`, or:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  web:
    build:
      target: build
    environment:
      NODE_ENV: development
      CONTENT_DIR: /app/content
      CACHE_DIR: /app/.cache
    volumes:
      - ./src:/app/src
      - ./content:/app/content
      - dev-cache:/app/.cache
    command: ["npm", "run", "dev"]

volumes:
  dev-cache:
