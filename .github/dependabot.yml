version: 2

# Dependency updates are grouped so we get one PR per ecosystem per week, not one
# per package. Groups only combine within an ecosystem, so npm and Docker still
# arrive as two PRs — there is no way to merge them into one.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/London
    open-pull-requests-limit: 1
    groups:
      npm:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: deps

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/London
    open-pull-requests-limit: 1
    groups:
      docker:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: deps
