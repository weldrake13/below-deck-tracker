services:
  web:
    build:
      context: .
    image: below-deck-tracker
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      # Live AIS tracking — see .env.example. Left blank, the app still runs,
      # just without live positions.
      AISSTREAM_API_KEY: "${AISSTREAM_API_KEY:-}"
    volumes:
      # Yacht/show data lives outside the image — adding a yacht or fixing a
      # season number just needs `docker compose restart web`, no rebuild.
      - ./content:/app/content:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
