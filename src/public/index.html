<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Below Deck Tracker</title>
  <meta name="description" content="Live map of the real yachts behind the Below Deck TV franchise." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%93%EF%B8%8F%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar__brand">
      <span class="topbar__anchor" aria-hidden="true">⚓</span>
      <div>
        <h1>Below Deck Tracker</h1>
        <p class="topbar__tagline">Where the real yachts behind the show are right now</p>
      </div>
    </div>
    <button id="filters-toggle" class="topbar__filters-toggle" type="button" aria-expanded="false" aria-controls="filters">
      Filters
    </button>
  </header>

  <div class="layout">
    <aside id="filters" class="filters">
      <div class="filters__section">
        <div class="filters__heading-row">
          <h2>Shows</h2>
          <button type="button" class="filters__clear" data-clear="shows">clear</button>
        </div>
        <div id="show-filters" class="chip-list" role="group" aria-label="Filter by show"></div>
      </div>

      <div class="filters__section">
        <div class="filters__heading-row">
          <h2>Yachts</h2>
          <button type="button" class="filters__clear" data-clear="yachts">clear</button>
        </div>
        <input id="yacht-search" class="filters__search" type="search" placeholder="Search yachts…" aria-label="Search yachts" />
        <div id="yacht-filters" class="yacht-checklist" role="group" aria-label="Filter by yacht"></div>
      </div>

      <p id="ais-status" class="filters__ais-status"></p>
    </aside>

    <main class="content">
      <div id="map" class="map" role="application" aria-label="Map of tracked yacht positions"></div>

      <section class="results">
        <div class="results__heading-row">
          <h2 id="results-count">Yachts</h2>
          <span class="results__legend">
            <span class="dot dot--live" aria-hidden="true"></span> live position
            <span class="dot dot--unknown" aria-hidden="true"></span> not currently tracked
          </span>
        </div>
        <ul id="yacht-list" class="yacht-list"></ul>
      </section>
    </main>
  </div>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/app.js"></script>
</body>
</html>
